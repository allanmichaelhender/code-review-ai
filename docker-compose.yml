services:
  postgres:
    image: postgres:15-alpine
    container_name: codereview-postgres
    environment:
      POSTGRES_DB: codereview
      POSTGRES_USER: codereview
      POSTGRES_PASSWORD: codereview
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - codereview-network

  redis:
    image: redis:7-alpine
    container_name: codereview-redis
    networks:
      - codereview-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: codereview-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - codereview-network
    profiles:
      - dev

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codereview-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/codereview
      DATABASE_USERNAME: codereview
      DATABASE_PASSWORD: codereview
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      OPEN_ROUTER_API_KEY: ${OPEN_ROUTER_API_KEY}
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN}
    depends_on:
      - postgres
      - redis
    networks:
      - codereview-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codereview-frontend
    profiles:
      - dev
    depends_on:
      - backend
    networks:
      - codereview-network

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: codereview-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
    networks:
      - codereview-network

  certbot:
    image: certbot/certbot
    container_name: codereview-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - codereview-network
    profiles:
      - certbot

volumes:
  postgres-data:
  certbot-conf:
  certbot-www:

networks:
  codereview-network:
    driver: bridge
